name: ci

on:
  push:
  pull_request:

jobs:
  license-audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with every public extra
        run: |
          python -m pip install --upgrade pip
          pip install ".[all]"
      - name: License audit (fails on GPL / AGPL / LGPL / unknown / banned)
        run: python tools/license_audit.py --markdown licenses-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: licenses-report
          path: licenses-report.md

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]   # macOS only (no Linux target)
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System tools (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Doctor (required components)
        run: pdfcore doctor
      - name: Tests
        run: pytest -m "not slow"
