title: Volunteer Handbook
subtitle: Production team · Fall 2026
date: September 2026
body: |
  # Welcome
  Thanks for serving on the production team. This handbook covers what to expect on a Sunday, how
  to prepare, and who to call when something breaks.

  # Your Sunday
  ## Before you arrive
  Check your position on the schedule by Thursday. Reply if you cannot make your call time.

  ## Call time
  Arrive at your call time, not before doors. Sign in at the tech desk and grab a headset.

  ## During the service
  - Keep talk on channel 1 short and clear.
  - Watch the producer for hand cues during quiet moments.

  # Positions
  ## Camera
  Frame tight on the speaker, leave headroom, and never zoom on air.

  ## Audio
  Ring out wireless mics at line check. Keep the program mix under 92 dB.

  ## Graphics
  Lower thirds stay on screen for five seconds. Proofread every slide before doors.

  # Contacts
  Producer: Avery Cole. Technical director: Riley Park.
