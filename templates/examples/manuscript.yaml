title: The Long Wire
subtitle: A novel
author: Sam Rivera
year: 2026
body: |
  = Chapter One

  The panel shop smelled of cut copper and hot plastic. Ana set her coffee on the bench and looked at
  the drawing again, the one with the coffee ring already on it, and counted the terminals twice.

  Nobody else was in yet. The compressor kicked on in the back room, ran for a minute, and stopped.
  She liked the shop like this: every tool where it belonged, every wire still a straight promise.

  She pulled the first conductor off the reel and measured it against the duct. Twenty-two inches.
  The drawing said eighteen. She checked the revision block in the corner: Rev 1, issued last Tuesday.
  Somebody had moved the drives.

  = Chapter Two

  By noon the whole crew knew. Marco read the addendum out loud in the break room, slowly, as if the
  words might change on a second reading. They did not. The surge device went in at the main panel,
  the exhaust fan grew a horsepower, and the schedule lost two days nobody had.
