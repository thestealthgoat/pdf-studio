# Bid set prep — rotate the landscape sheet, number every page, build bookmarks from headings.
#
# Run:      pdfcore recipe bid-set-prep  bids/*.pdf            (or a path to this file)
# Check:    pdfcore recipe bid-set-prep  bids/*.pdf --dry-run  (shows the plan, checks every op resolves)
#
# Each step is {op: <module.function>, <parameter>: <value>, ...}. The op names resolve at run time to
# the library functions in pdfcore.ops (organize.rotate → pdfcore.ops.organize.rotate, ...); a step
# whose module is not installed/built yet is reported by --dry-run and fails that file instead of
# crashing the batch. Keys are passed as keyword arguments, so they must match the function's
# parameters (`pdfcore recipe ... --dry-run` lists the accepted ones when a key is wrong).
# A text page spec ("2", "1-3,5", "odd", "last") works for any op's `pages`.
name: Bid set prep
description: Rotate landscape sheet, page-number footer, auto bookmarks
# input: bids/*.pdf              # optional: glob/folder/file(s), relative to this file
# output: bid-ready/             # optional: folder (relative to this file); default next to each input
naming: "{stem}.bid.pdf"
steps:
  - op: organize.rotate
    pages: "2"                   # the landscape sheet(s)
    angle: 90                    # clockwise, multiple of 90 (`degrees:` works too)
  - op: stamp.stamp
    texts:
      footer-center: "Page {page} of {pages}"
      footer-right: "{date}"
  - op: navigate.auto_bookmarks  # also accepted: bookmarks_auto, navigate.bookmarks_auto
    max_levels: 2
